# TestSphere on one EC2 instance, four containers from two images:
#   caddy     HTTPS on 80/443 (Let's Encrypt for $DOMAIN) -> frontend
#   frontend  dashboard (nginx), proxies /api to backend      [testsphere-frontend image]
#   backend   FastAPI API                                     [testsphere image]
#   worker    pipeline runs and the scheduler                 [testsphere image]
#
#   cd /opt/testsphere/app/deploy/aws-ec2 && ./fetch-env.sh \
#     && GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
# Secrets come from SSM Parameter Store (/testsphere/*) via fetch-env.sh into
# /opt/testsphere/secrets.env; settings that are not secret live here.
#
# Images: continuous deployment (cd/pull-deploy.sh) writes the published
# ghcr.io digests to this folder's .env as TESTSPHERE_IMAGE and
# TESTSPHERE_FRONTEND_IMAGE, so nothing builds on the instance. Without them
# `--build` builds both here.

x-logging: &logging
  # Docker keeps container logs forever by default; cap them at 3 × 10 MB
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

x-backend: &backend
  build:
    context: ../../backend
    args:
      GIT_COMMIT: ${GIT_COMMIT:-}
  image: ${TESTSPHERE_IMAGE:-testsphere-backend:latest}
  restart: unless-stopped
  logging: *logging
  env_file: /opt/testsphere/secrets.env
  environment: &backend-env
    APP_ENV: production
    # Runs are queued by the API and executed by the worker, so an API restart
    # never interrupts a scan
    PIPELINE_EXECUTION: worker
    # 2 GB instance: one browser at a time; further runs queue
    ENGINE_MAX_BROWSERS: "1"
    # The frontend container proxies /api on the same origin, so no CORS origins
    DASHBOARD_URL: https://${DOMAIN}
    LOG_FORMAT: json
    # Security scanning scope: ONLY hosts we own or are authorized to test
    # (loopback is always allowed). List individual hosts, never a shared
    # platform apex (e.g. vercel.app, onrender.com, hf.space) — that would
    # authorize attacks on other people's apps. Add a new owned host here.
    SECURITY_SCAN_ALLOWED_HOSTS: "54-153-148-247.sslip.io"
    # Active (DAST) scanning sends real XSS/SQLi/open-redirect payloads.
    # On for authorized testing — aim it at staging/demo, not live prod data.
    SECURITY_ACTIVE_SCAN: "true"
    # ...and only for these Firebase uids (comma-separated; set in this folder's
    # .env next to DOMAIN). Empty = nobody, so no guest or other user can.
    SECURITY_ACTIVE_SCAN_USERS: ${SECURITY_ACTIVE_SCAN_USERS:-}
    # Run artifacts: the data volume by default, or an S3 bucket (README:
    # "Artifacts in S3"), set in this folder's .env
    ARTIFACT_STORE: ${ARTIFACT_STORE:-local}
    ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-}
    AWS_REGION: ap-southeast-2
  volumes:
    - testsphere-data:/app/backend/data   # artifacts (screenshots, traces) the API serves and the worker writes

services:
  backend:
    <<: *backend
    # Port 8000 is reachable only by the frontend container, never published
    expose: ["8000"]

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # The sandbox for a repository's own tests (when its CI has no results):
    # the worker starts throwaway containers through the host's Docker.  This
    # socket gives the worker control of Docker, so only the worker gets it;
    # the repository code runs in the sandbox containers, never here.  It
    # refuses to run until sandbox-firewall.sh blocks the metadata service.
    environment:
      <<: *backend-env
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
    volumes:
      - testsphere-data:/app/backend/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-999}"]   # the host's docker group (pull-deploy.sh records it in .env)
    healthcheck:
      # The image's check probes the API's HTTP port, which the worker has none
      # of; this one fails when the worker loop stops (no database read)
      test: ["CMD", "python", "-m", "app.worker_alive"]
      interval: 60s
      timeout: 15s
      start_period: 60s
    depends_on: [backend]

  frontend:
    build: ../../frontend
    # The image published for this commit by .github/workflows/deploy.yml
    # (cd/pull-deploy.sh pins its digest); with --build, built here instead
    image: ${TESTSPHERE_FRONTEND_IMAGE:-ghcr.io/krishna201i/testsphere-frontend:${GIT_COMMIT:-main}}
    restart: unless-stopped
    logging: *logging
    environment:
      BACKEND_HOST: backend:8000
    expose: ["8080"]
    depends_on: [backend]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. 54-153-148-247.sslip.io}
      # Where HTTPS traffic goes (read by the Caddyfile). Changing it recreates
      # this container, so a new Caddyfile is always picked up with it
      UPSTREAM: frontend:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend]

volumes:
  testsphere-data:
  caddy-data:
  caddy-config:
