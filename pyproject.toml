[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testsphere-ai"
version = "0.1.0"
description = "Autonomous Agentic QA & Self-Healing Testing Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "langchain-core>=1.2.22,<2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "firebase-admin>=6.5.0",
    "httpx>=0.24.0",
    "pydantic-settings>=2.0.0",
    "playwright>=1.40.0,<2.0",
    "rapidfuzz>=3.0.0,<4.0",
    "sentry-sdk>=2.0,<3.0",
]

[project.scripts]
testsphere-mcp = "backend.mcp_server:main"

[project.optional-dependencies]
engine = [
    "playwright>=1.40,<2.0",
    "rapidfuzz>=3.0,<4.0",
]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "pytest-asyncio>=0.21,<1.0",
    "playwright>=1.40,<2.0",
    "rapidfuzz>=3.0,<4.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "engine*", "backend*", "security*", "ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "frontend", "artifacts", "data"]

[tool.ruff.lint]
# Correctness (pyflakes, syntax), import order, modern syntax, likely bugs,
# and over-broad excepts.  CI runs exactly this set.
select = ["E9", "F", "I", "UP", "B", "BLE"]
# UP042 (str+Enum -> StrEnum) changes how stored enum values format
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be call defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "BLE001"]
