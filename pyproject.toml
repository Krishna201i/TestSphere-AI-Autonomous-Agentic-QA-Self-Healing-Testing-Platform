[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testsphere-ai"
version = "0.1.0"
description = "Autonomous Agentic QA & Self-Healing Testing Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "langchain-core>=0.2,<1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
engine = [
    "playwright>=1.40,<2.0",
    "rapidfuzz>=3.0,<4.0",
]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "pytest-asyncio>=0.21,<1.0",
    "playwright>=1.40,<2.0",
    "rapidfuzz>=3.0,<4.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "engine*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
