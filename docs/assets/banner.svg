<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="TestSphere AI: Autonomous agentic QA and self-healing testing platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2218"/>
      <stop offset=".55" stop-color="#143a28"/>
      <stop offset="1" stop-color="#1d5a3c"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".85" cy=".15" r=".6">
      <stop offset="0" stop-color="#5fd39a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5fd39a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".95" r=".5">
      <stop offset="0" stop-color="#e9c46a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e9c46a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7be0ad"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="hexB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b9f0d3"/>
      <stop offset="1" stop-color="#4cc38a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9f0d3"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".07"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glow1)"/>
    <rect width="1280" height="400" fill="url(#glow2)"/>

    <!-- orbit rings -->
    <g fill="none" stroke="#7be0ad" stroke-opacity=".18" transform="translate(1030 200)">
      <circle r="90"/>
      <circle r="140" stroke-dasharray="3 9"/>
      <circle r="190" stroke-opacity=".1"/>
      <circle r="250" stroke-opacity=".06"/>
    </g>
    <g transform="translate(1030 200)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <circle cx="140" cy="0" r="7" fill="#7be0ad"/>
        <circle cx="140" cy="0" r="14" fill="#7be0ad" opacity=".2"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="38s" repeatCount="indefinite"/>
        <circle cx="190" cy="0" r="6" fill="#e9c46a"/>
        <circle cx="190" cy="0" r="12" fill="#e9c46a" opacity=".2"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="52s" repeatCount="indefinite"/>
        <circle cx="250" cy="0" r="5" fill="#ffffff" opacity=".85"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
        <circle cx="90" cy="0" r="5" fill="#b9f0d3"/>
      </g>

      <!-- logo cube -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -5;0 5;0 -5" dur="5s" repeatCount="indefinite"/>
        <g transform="translate(-62 -62) scale(2.6)">
          <path d="M24 3 42 13.5v21L24 45 6 34.5v-21Z" fill="url(#hexA)"/>
          <path d="M24 3 42 13.5 24 24 6 13.5Z" fill="url(#hexB)" opacity=".95"/>
          <path d="M24 24v21L6 34.5v-21Z" fill="#0f4a2f" opacity=".8"/>
          <path d="M24 13 33 18.2v10.5L24 34l-9-5.3V18.2Z" fill="#fff" opacity=".95"/>
        </g>
      </g>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <rect x="72" y="62" rx="15" ry="15" width="318" height="30" fill="#ffffff" fill-opacity=".08" stroke="#7be0ad" stroke-opacity=".4"/>
      <circle cx="92" cy="77" r="4.5" fill="#7be0ad">
        <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="106" y="82" font-size="13" font-weight="600" letter-spacing="1.6" fill="#b9f0d3">AUTONOMOUS · AGENTIC · SELF-HEALING</text>

      <text x="70" y="168" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">TestSphere AI</text>
      <text x="72" y="214" font-size="27" font-weight="500" fill="#d8efe2">Give it a URL. It tests, heals, secures and fixes your web app.</text>
      <text x="72" y="250" font-size="18" fill="#9cc7b0">Plan  →  Run in a real browser  →  Self-heal  →  Scan  →  Open the fix as a PR  →  Verify  →  Deploy</text>

      <g transform="translate(72 290)">
        <g>
          <rect width="170" height="54" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
          <text x="18" y="29" font-size="26" font-weight="800" fill="#7be0ad">95.7%</text>
          <text x="18" y="46" font-size="12" fill="#b4d6c3">locators healed correctly</text>
        </g>
        <g transform="translate(184 0)">
          <rect width="150" height="54" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
          <text x="18" y="29" font-size="26" font-weight="800" fill="#e9c46a">0</text>
          <text x="18" y="46" font-size="12" fill="#b4d6c3">false heals, ever</text>
        </g>
        <g transform="translate(348 0)">
          <rect width="170" height="54" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
          <text x="18" y="29" font-size="26" font-weight="800" fill="#7be0ad">2,000+</text>
          <text x="18" y="46" font-size="12" fill="#b4d6c3">automated tests in CI</text>
        </g>
        <g transform="translate(532 0)">
          <rect width="170" height="54" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
          <text x="18" y="29" font-size="26" font-weight="800" fill="#e9c46a">WCAG AA</text>
          <text x="18" y="46" font-size="12" fill="#b4d6c3">light and dark themes</text>
        </g>
      </g>
    </g>
  </g>
</svg>
