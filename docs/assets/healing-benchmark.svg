<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Self-healing benchmark: TestSphere healer versus a static fallback chain over 277 broken-locator cases">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a6a46"/><stop offset="1" stop-color="#4cc38a"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#f08a4b"/></linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b93a1"/><stop offset="1" stop-color="#bcc3cf"/></linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#17402c" flood-opacity=".12"/></filter>
  </defs>
  <style>
    text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .t{font-size:22px;font-weight:700;fill:#17402c}
    .s{font-size:13px;fill:#63646d}
    .l{font-size:14px;font-weight:600;fill:#1c1e2a}
    .v{font-size:14px;font-weight:700;fill:#1c1e2a}
    .ax{font-size:11px;fill:#8a8b94}
    .bar{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both;transform-origin:left center}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x="8" y="8" width="1184" height="444" rx="24" fill="#fbfaf7" stroke="#e6e0d8" filter="url(#sh)"/>
  <text x="44" y="56" class="t">Self-healing benchmark · 277 broken-locator cases</text>
  <text x="44" y="78" class="s">4 pages × every target × 15 mutations (11 where healing is right, 4 where the right answer is to refuse)</text>

  <!-- legend -->
  <g transform="translate(760 100)">
    <rect width="14" height="14" rx="4" fill="url(#g)"/><text x="22" y="12" class="s">Heals where it should</text>
    <rect x="170" width="14" height="14" rx="4" fill="url(#r)"/><text x="192" y="12" class="s">False heals</text>
    <rect x="278" width="14" height="14" rx="4" fill="url(#n)"/><text x="300" y="12" class="s">Correct refusals</text>
  </g>

  <!-- grid -->
  <g transform="translate(250 130)">
    <g stroke="#e6e0d8" stroke-dasharray="3 5">
      <line x1="0" y1="0" x2="0" y2="270"/><line x1="225" y1="0" x2="225" y2="270"/><line x1="450" y1="0" x2="450" y2="270"/><line x1="675" y1="0" x2="675" y2="270"/><line x1="900" y1="0" x2="900" y2="270"/>
    </g>
    <g class="ax" text-anchor="middle"><text x="0" y="288" class="ax">0%</text><text x="225" y="288" class="ax">25%</text><text x="450" y="288" class="ax">50%</text><text x="675" y="288" class="ax">75%</text><text x="900" y="288" class="ax">100%</text></g>

    <!-- No healing -->
    <text x="-20" y="30" text-anchor="end" class="l">No healing</text>
    <rect x="0" y="12" width="2" height="16" rx="3" fill="url(#g)"/><text x="12" y="25" class="v">0%</text>
    <rect x="0" y="34" width="2" height="16" rx="3" fill="url(#r)"/><text x="12" y="47" class="v">0%</text>
    <rect class="bar" x="0" y="56" width="900" height="16" rx="8" fill="url(#n)"/><text x="908" y="69" class="v" text-anchor="start" dx="-52" fill="#fff" style="fill:#fff">100%</text>

    <!-- Fallback chain -->
    <text x="-20" y="125" text-anchor="end" class="l">Fallback chain</text>
    <text x="-20" y="143" text-anchor="end" class="s">first unique fallback</text>
    <rect class="bar" x="0" y="100" width="864.9" height="16" rx="8" fill="url(#g)" style="animation-delay:.15s"/><text x="872" y="113" class="v" style="fill:#fff" dx="-62">96.1%</text>
    <rect class="bar" x="0" y="122" width="156.6" height="16" rx="8" fill="url(#r)" style="animation-delay:.25s"/><text x="166" y="135" class="v" style="fill:#b3400a">17.4% of heals hit the wrong element</text>
    <rect class="bar" x="0" y="144" width="360" height="16" rx="8" fill="url(#n)" style="animation-delay:.35s"/><text x="368" y="157" class="v">40.0%</text>

    <!-- TestSphere -->
    <rect x="-236" y="176" width="1160" height="92" rx="16" fill="#e4f1e8" stroke="#9fcbb0"/>
    <text x="-20" y="214" text-anchor="end" class="l" style="fill:#17402c;font-size:16px">TestSphere healer</text>
    <text x="-20" y="233" text-anchor="end" class="s" style="fill:#2a6a46">fingerprint scoring</text>
    <rect class="bar" x="0" y="188" width="861.3" height="16" rx="8" fill="url(#g)" style="animation-delay:.45s"/><text x="868" y="201" class="v" style="fill:#fff" dx="-62">95.7%</text>
    <rect class="bar" x="0" y="210" width="3" height="16" rx="2" fill="url(#r)" style="animation-delay:.55s"/><text x="14" y="223" class="v" style="fill:#17402c">0.0% · zero false heals (0 of all heals)</text>
    <rect class="bar" x="0" y="232" width="900" height="16" rx="8" fill="url(#n)" style="animation-delay:.65s"/><text x="905" y="245" class="v" style="fill:#fff" dx="-62">100%</text>
  </g>

  <text x="44" y="436" class="s">Source: docs/healing-benchmark.md · generated by python -m engine.heal_benchmark · gated in CI: any false heal fails the build</text>
</svg>
