# Continuous deployment, pull-based: after CI passes on main this builds the
# backend and frontend images and publishes them to GitHub's container
# registry (ghcr.io) as :<commit> and :main.  The EC2 instance pulls them: a
# systemd timer there (deploy/aws-ec2/cd/pull-deploy.sh) sees the new :main,
# starts both, waits for /api/health and rolls back to the previous images if
# they are not healthy.
#
# No AWS credentials are stored here or needed: the AWS project's managed
# policies do not allow GitHub to federate into the account (OIDC), and a
# long-lived access key would be the weaker alternative.  The repository is
# public, so the instance pulls without a token.
#
# Off until the repository variable DEPLOY_ENABLED is "true".  Rollback: run
# this workflow by hand with an earlier commit; it re-tags that commit's image
# as :main and the instance rolls to it.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to deploy (default: the latest on main); for a rollback, an earlier one"
        required: false

permissions:
  contents: read
  packages: write # publish the image to ghcr.io with the workflow's own token

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cut a publish off halfway

jobs:
  publish:
    name: Build and publish the image
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Commit to deploy
        id: commit
        env:
          INPUT: ${{ inputs.commit }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha="${INPUT:-${RUN_SHA:-$GITHUB_SHA}}"
          echo "$sha" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "not a commit: $sha"; exit 1; }
          # checkout needs the full SHA (a short one is taken for a branch name)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$sha" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.commit.outputs.sha }}

      # Two images per commit: the backend (ghcr.io/<owner>/testsphere, the API
      # and the worker) and the frontend (ghcr.io/<owner>/testsphere-frontend,
      # the dashboard on nginx). Both are tagged :<sha> and :<sha:0:7>; the
      # backend's :main moves last, because it is what the instance watches,
      # and the instance then pulls the frontend of that same commit.
      - name: Build (or reuse) the commit's images and publish them as :main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          short=${sha:0:7}
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          publish() {  # publish REPO CONTEXT
            local repo=$1 context=$2
            if docker pull -q "$repo:$sha" >/dev/null 2>&1; then
              echo "$repo:$sha already published (rollback or rerun): not rebuilding"
            else
              docker build --build-arg GIT_COMMIT="$short" \
                --label org.opencontainers.image.revision="$sha" \
                --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
                -t "$repo:$sha" "$context"
              docker push -q "$repo:$sha"
            fi
            docker tag "$repo:$sha" "$repo:$short"
            docker push -q "$repo:$short"
          }
          publish "ghcr.io/$owner/testsphere-frontend" frontend
          publish "ghcr.io/$owner/testsphere" backend
          # The instance pulls without a token. GitHub creates a new package as
          # private, so moving :main before both are public would make the
          # instance try (and roll back) a version it cannot pull
          for repo in "ghcr.io/$owner/testsphere-frontend" "ghcr.io/$owner/testsphere"; do
            if ! DOCKER_CONFIG=$(mktemp -d) docker manifest inspect "$repo:$sha" >/dev/null 2>&1; then
              echo "::error::$repo is not public. Package settings → Change visibility → Public, then re-run this workflow."
              exit 1
            fi
          done
          for repo in "ghcr.io/$owner/testsphere-frontend" "ghcr.io/$owner/testsphere"; do
            docker tag "$repo:$sha" "$repo:main"
            docker push -q "$repo:main"
          done
          {
            echo "Published for $sha:"
            echo "- ghcr.io/$owner/testsphere:main (backend)"
            echo "- ghcr.io/$owner/testsphere-frontend:main (frontend)"
            echo "The instance picks them up within a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"
