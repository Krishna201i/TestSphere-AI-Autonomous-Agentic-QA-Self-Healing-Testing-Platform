# Continuous deployment, pull-based: after CI passes on main this builds the
# image and publishes it to GitHub's container registry (ghcr.io) as
# :<commit> and :main.  The EC2 instance pulls it: a systemd timer there
# (deploy/aws-ec2/cd/pull-deploy.sh) sees the new :main, starts it, waits for
# /api/health and rolls back to the previous image if it is not healthy.
#
# No AWS credentials are stored here or needed: the AWS project's managed
# policies do not allow GitHub to federate into the account (OIDC), and a
# long-lived access key would be the weaker alternative.  The repository is
# public, so the instance pulls without a token.
#
# Off until the repository variable DEPLOY_ENABLED is "true".  Rollback: run
# this workflow by hand with an earlier commit; it re-tags that commit's image
# as :main and the instance rolls to it.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to deploy (default: the latest on main); for a rollback, an earlier one"
        required: false

permissions:
  contents: read
  packages: write # publish the image to ghcr.io with the workflow's own token

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cut a publish off halfway

jobs:
  publish:
    name: Build and publish the image
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Commit to deploy
        id: commit
        env:
          INPUT: ${{ inputs.commit }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          sha="${INPUT:-${RUN_SHA:-$GITHUB_SHA}}"
          echo "$sha" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "not a commit: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Build (or reuse) the commit's image and publish it as :main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          repo="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/testsphere"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker pull -q "$repo:$sha" >/dev/null 2>&1; then
            echo "Image for $sha already published (rollback or rerun): not rebuilding"
          else
            docker build --build-arg GIT_COMMIT="$short" \
              --label org.opencontainers.image.revision="$sha" \
              --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
              -t "$repo:$sha" .
            docker push -q "$repo:$sha"
          fi
          docker tag "$repo:$sha" "$repo:main"
          docker push -q "$repo:main"
          echo "Published $repo:main = $sha; the instance picks it up within a few minutes." >> "$GITHUB_STEP_SUMMARY"
