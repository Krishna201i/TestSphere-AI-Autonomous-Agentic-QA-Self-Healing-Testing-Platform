# Runs on every pull request and on pushes to main (which Render deploys).
# Both jobs must pass before a PR is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, lint, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -e ".[dev]" ruff pip-audit

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # tests/e2e drives the built dashboard served by the backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard for the end-to-end tests
        working-directory: frontend
        run: npm ci && npm run build

      # Rule set in pyproject.toml [tool.ruff.lint]
      - name: Lint
        run: ruff check

      # The Firestore store's contract tests (incl. update_if transactions) run
      # only against the official emulator
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore -p 8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators             gcloud emulators firestore start --host-port=0.0.0.0:8080
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ && break; sleep 2; done

      - name: Tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: python -m pytest -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt --require-hashes

  frontend:
    name: Frontend (unit tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  security-scan:
    name: Security scan (secrets, static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      # Known false positives are listed in .gitleaksignore
      - name: Secrets (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

      # Triaged false positives are marked inline with `nosemgrep: <rule> - reason`
      - name: Static analysis (semgrep)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0
          semgrep scan --metrics=off --error
          --config p/python --config p/security-audit --config p/owasp-top-ten
          --config p/javascript --config p/react --config p/dockerfile --config p/github-actions
          --exclude build --exclude tests --exclude frontend/node_modules --exclude frontend/dist
