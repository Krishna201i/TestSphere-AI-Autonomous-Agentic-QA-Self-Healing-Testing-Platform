# Runs on every pull request and on pushes to main (which Render deploys).
# Both jobs must pass before a PR is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, lint, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -e ".[dev]" ruff pip-audit

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Correctness rules only (syntax errors, undefined names); the style
      # backlog is cleaned up separately before widening this.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 agents backend engine security ingestion tests

      - name: Tests
        run: python -m pytest -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt --require-hashes

  frontend:
    name: Frontend (build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
