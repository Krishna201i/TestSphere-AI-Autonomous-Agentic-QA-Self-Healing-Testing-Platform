# Runs on every pull request and on pushes to main.
# Every job must pass before a PR is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, lint, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -e ".[dev]" ruff pip-audit

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # tests/e2e drives the built dashboard served by the backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard for the end-to-end tests
        working-directory: frontend
        run: npm ci && npm run build

      # Rule set in pyproject.toml [tool.ruff.lint]
      - name: Lint
        run: ruff check

      # The Firestore store's contract tests (incl. update_if transactions) run
      # only against the official emulator
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore -p 8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators             gcloud emulators firestore start --host-port=0.0.0.0:8080
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ && break; sleep 2; done

      # The database-input tests also run against a real PostgreSQL
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=shop -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec postgres pg_isready -U postgres && break; sleep 1; done

      - name: Tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          TEST_POSTGRES_URL: postgresql://postgres:ci@127.0.0.1:5432/shop
        run: python -m pytest -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt --require-hashes

  frontend:
    name: Frontend (unit tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  security-scan:
    name: Security scan (secrets, static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      # Known false positives are listed in .gitleaksignore
      - name: Secrets (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

      # Triaged false positives are marked inline with `nosemgrep: <rule> - reason`
      - name: Static analysis (semgrep)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0
          semgrep scan --metrics=off --error
          --config p/python --config p/security-audit --config p/owasp-top-ten
          --config p/javascript --config p/react --config p/dockerfile --config p/github-actions
          --exclude build --exclude tests --exclude frontend/node_modules --exclude frontend/dist

  # The production image (what the EC2 server runs): builds, and the tools the
  # backend shells out to work inside it
  docker:
    name: Docker image (build, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: docker build -t testsphere:ci .

      - name: Tools inside the image
        run: |
          set -eu
          run() { docker run --rm testsphere:ci "$@"; }
          test "$(run id -u)" = 10001 || { echo "the image must run as uid 10001"; exit 1; }
          run git --version
          # Ingestion clones repositories with git
          run sh -c 'git clone -q --depth 1 https://github.com/octocat/Hello-World.git /tmp/repo && test -f /tmp/repo/README'
          # Headless Chromium starts (browser and system libraries present)
          run python -c "from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(); pg.set_content('<h1>ok</h1>')
              assert pg.inner_text('h1') == 'ok'; b.close()
          print('chromium ok')"

      - name: Server starts and serves the dashboard
        run: |
          set -eu
          docker run -d --name ts -p 8000:8000 -e AUTH_REQUIRED=false -e DATABASE_BACKEND=local testsphere:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -sf -o /dev/null -w '%{content_type}\n' http://127.0.0.1:8000/ | grep -q text/html
          echo "server ok"

      - name: Container logs
        if: failure()
        run: docker logs ts 2>&1 | tail -100 || true
