# Runs on every pull request and on pushes to main.
# Runners are pinned (not ubuntu-latest): a new image can lack the pinned Python
# (.python-version) and fail every job before a test runs.
# Every job must pass before a PR is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests, lint, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -e ".[dev]" ruff pip-audit

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # backend/tests/e2e drives the built dashboard served by the backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard for the end-to-end tests
        working-directory: frontend
        run: npm ci && npm run build

      # Rule set in pyproject.toml [tool.ruff.lint]
      - name: Lint
        run: ruff check

      # The Firestore store's contract tests (incl. update_if transactions) run
      # only against the official emulator
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore -p 8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators             gcloud emulators firestore start --host-port=0.0.0.0:8080
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ && break; sleep 2; done

      # The database-input tests also run against a real PostgreSQL
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=shop -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec postgres pg_isready -U postgres && break; sleep 1; done

      - name: Tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          TEST_POSTGRES_URL: postgresql://postgres:ci@127.0.0.1:5432/shop
        run: python -m pytest -q

      # The published healing numbers are a promise: any false heal, or a
      # drop below 90% of the cases it should heal (92.3% today), fails CI
      - name: Healing benchmark gate (quick, 52 cases)
        run: python -m engine.heal_benchmark --quick --gate 0.90

      # Plain-English tests (Test Studio, rule-based planner): any false alarm, or
      # fewer than 85% of the described bugs caught (95% today), fails CI
      - name: Test Studio accuracy gate (15 instructions, 19 bugs)
        run: python -m scripts.studio_eval --rules --gate 0.85 --no-report

      - name: Dependency audit
        run: pip-audit -r requirements.txt --require-hashes

  # The engine also runs tests in Firefox and WebKit (ENGINE_BROWSER); the
  # backend job only installs Chromium, so its engine tests cover that alone
  engine-browsers:
    name: Engine (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    # Installing WebKit's ~190 system packages has taken 17 minutes on a slow
    # Ubuntu mirror; the tests themselves take about 5
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -e ".[dev]"

      - name: Install ${{ matrix.browser }} (and Chromium, which some engine tests always use)
        env:
          BROWSER: ${{ matrix.browser }}
        run: python -m playwright install --with-deps chromium "$BROWSER"

      - name: Engine tests in ${{ matrix.browser }}
        env:
          ENGINE_BROWSER: ${{ matrix.browser }}
        run: python -m pytest -q tests/engine

  frontend:
    name: Frontend (unit tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  security-scan:
    name: Security scan (secrets, static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      # Known false positives are listed in .gitleaksignore
      - name: Secrets (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

      # Triaged false positives are marked inline with `nosemgrep: <rule> - reason`
      - name: Static analysis (semgrep)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0
          semgrep scan --metrics=off --error
          --config p/python --config p/security-audit --config p/owasp-top-ten
          --config p/javascript --config p/react --config p/dockerfile --config p/github-actions
          --exclude build --exclude tests --exclude frontend/node_modules --exclude frontend/dist

  # The production images (what the EC2 server runs): both build, the tools
  # the backend shells out to work inside it, and the two containers work
  # together (the frontend serves the dashboard and proxies /api)
  docker:
    name: Docker images (build, smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: docker compose build

      - name: Tools inside the backend image
        run: |
          set -eu
          run() { docker run --rm testsphere-backend:local "$@"; }
          test "$(run id -u)" = 10001 || { echo "the backend image must run as uid 10001"; exit 1; }
          run git --version
          # The sandbox for a repository's own tests is driven with the Docker CLI
          run docker --version
          # Ingestion clones repositories with git
          run sh -c 'git clone -q --depth 1 https://github.com/octocat/Hello-World.git /tmp/repo && test -f /tmp/repo/README'
          # Headless Chromium starts (browser and system libraries present)
          run python -c "from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(); pg.set_content('<h1>ok</h1>')
              assert pg.inner_text('h1') == 'ok'; b.close()
          print('chromium ok')"

      - name: The two containers serve the dashboard and the API
        run: |
          set -eu
          docker compose up -d --wait --wait-timeout 120
          base=http://127.0.0.1:8080
          # API through the frontend's proxy
          curl -sf "$base/api/health" | grep -q '"status":"ok"'
          curl -sf "$base/api/system" | grep -q '"service"'
          curl -sf -o /dev/null "$base/openapi.json"
          # Dashboard from nginx, with the security headers; unknown paths fall back to it
          curl -sf -D headers.txt -o index.html "$base/"
          grep -qi '^content-type: text/html' headers.txt
          grep -qi "^content-security-policy: default-src 'self'" headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -q '<div id="root"' index.html
          curl -sf "$base/some/page" | grep -q '<div id="root"'
          # Built assets load and are cached
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -1)
          curl -sf -D asset-headers.txt -o /dev/null "$base$asset"
          grep -qi 'cache-control: .*immutable' asset-headers.txt
          # The backend is not published: only the frontend port is open
          if curl -sf --max-time 3 http://127.0.0.1:8000/api/health; then echo "the backend port must not be published"; exit 1; fi
          echo "frontend + backend ok"

      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100 || true
